<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarik Tambang - Narrative Text</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 70%, #7CB342 100%);
    min-height: 100vh;
    padding: 20px;
    color: #222;
  }
  h1 { text-align: center; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,.4); margin-bottom: 10px; }
  .subtitle { text-align: center; color: #fff; margin-bottom: 20px; }

  .arena {
    max-width: 1000px; margin: 0 auto;
    background: rgba(255,255,255,.9);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }

  .scoreboard {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .team-info {
    padding: 10px 20px; border-radius: 12px; color: #fff; font-weight: bold;
    min-width: 180px; text-align: center;
  }
  .team-left { background: #1976D2; }
  .team-right { background: #D32F2F; }
  .vs { font-size: 28px; font-weight: bold; color: #555; }

  .rope-arena {
    position: relative;
    height: 120px;
    background: linear-gradient(180deg, transparent 40%, #c9a66b 40%, #c9a66b 60%, transparent 60%);
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
    border: 2px solid #8b6f3a;
  }
  .center-line {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 4px; background: #fff; transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(0,0,0,.5);
  }
  .center-line::before {
    content: "START"; position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%); font-size: 12px; color: #555; font-weight: bold;
  }
  .rope {
    position: absolute; top: 50%; left: 0; right: 0;
    height: 14px;
    background: repeating-linear-gradient(45deg, #8B4513, #8B4513 10px, #A0522D 10px, #A0522D 20px);
    transform: translateY(-50%);
    border-radius: 7px;
  }
  .flag {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -100%);
    width: 0; height: 0;
    transition: left 0.8s cubic-bezier(.5,1.6,.4,1);
    z-index: 2;
  }
  .flag::before {
    content: ""; position: absolute; left: -2px; top: 0;
    width: 4px; height: 60px; background: #333;
  }
  .flag::after {
    content: ""; position: absolute; left: 2px; top: 0;
    width: 40px; height: 25px;
    background: #FFD700;
    border: 2px solid #333;
    clip-path: polygon(0 0, 100% 0, 80% 50%, 100% 100%, 0 100%);
  }
  .team-icon {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .icon-left { left: 10px; background: #1976D2; }
  .icon-right { right: 10px; background: #D32F2F; }

  .question-box {
    background: #f0f4f8;
    border-left: 6px solid #FFB300;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  .turn-label {
    display: inline-block; padding: 4px 12px;
    border-radius: 20px; color: #fff; font-size: 13px;
    margin-bottom: 8px; font-weight: bold;
  }
  .turn-left { background: #1976D2; }
  .turn-right { background: #D32F2F; }
  .q-number { color: #666; font-size: 13px; margin-bottom: 6px; }
  .q-text { font-size: 17px; font-weight: 600; color: #222; }

  .options { display: grid; gap: 10px; margin-bottom: 15px; }
  .option {
    padding: 12px 16px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    transition: all .2s;
  }
  .option:hover:not(:disabled) { border-color: #FFB300; background: #FFF8E1; }
  .option:disabled { cursor: not-allowed; }
  .option.correct { background: #C8E6C9; border-color: #2E7D32; color: #1B5E20; font-weight: bold; }
  .option.wrong { background: #FFCDD2; border-color: #C62828; color: #B71C1C; }

  .feedback {
    text-align: center; padding: 10px;
    border-radius: 8px; margin-bottom: 10px;
    font-weight: bold;
  }
  .feedback.correct { background: #C8E6C9; color: #1B5E20; }
  .feedback.wrong { background: #FFCDD2; color: #B71C1C; }

  .next-btn, .restart-btn {
    display: block; margin: 10px auto;
    padding: 12px 30px;
    background: #FFB300; color: #fff;
    border: none; border-radius: 25px;
    font-size: 16px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
  }
  .next-btn:hover, .restart-btn:hover { background: #FFA000; }
  .restart-btn { background: #43A047; }

  .progress {
    text-align: center; color: #555;
    font-size: 14px; margin-bottom: 10px;
  }

  .winner-screen { text-align: center; padding: 30px; }
  .winner-screen h2 { font-size: 36px; margin-bottom: 15px; }
  .winner-screen .trophy { font-size: 80px; margin-bottom: 10px; }
  .hidden { display: none; }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .arena { padding: 18px 14px; }
    .team-info { min-width: 0; padding: 10px; flex: 1; }
    .scoreboard { gap: 10px; }
    .vs { font-size: 20px; }
    .q-text { font-size: 16px; }
    .winner-screen h2 { font-size: 28px; }
  }
</style>
</head>
<body>

<h1>🏆 TARIK TAMBANG 🏆</h1>
<p class="subtitle">Quiz Narrative Text — Tim Kiri vs Tim Kanan</p>

<main class="arena">
  <div class="scoreboard">
    <div class="team-info team-left">TIM KIRI<br><span id="scoreLeft">0</span> poin</div>
    <div class="vs">VS</div>
    <div class="team-info team-right">TIM KANAN<br><span id="scoreRight">0</span> poin</div>
  </div>

  <div class="rope-arena" aria-label="Posisi tali tarik tambang">
    <div class="team-icon icon-left" aria-hidden="true">K</div>
    <div class="team-icon icon-right" aria-hidden="true">A</div>
    <div class="center-line"></div>
    <div class="rope"></div>
    <div class="flag" id="flag"></div>
  </div>

  <section id="gameArea" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div class="question-box">
      <span class="turn-label" id="turnLabel"></span>
      <div class="q-number" id="qNumber"></div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback hidden" id="feedback" role="status"></div>
    <button class="next-btn hidden" id="nextBtn" type="button">Soal Berikutnya →</button>
  </section>

  <section id="winnerArea" class="winner-screen hidden" aria-live="polite">
    <div class="trophy">🏆</div>
    <h2 id="winnerText"></h2>
    <p id="finalScore" style="margin-bottom:20px;"></p>
    <button class="restart-btn" type="button" onclick="location.reload()">🔄 Main Lagi</button>
  </section>
</main>

<script>
const questions = [
  {
    team: "left",
    topic: "Definisi Narrative Text",
    q: "Apa yang dimaksud dengan Narrative Text?",
    options: [
      "Teks yang menjelaskan cara membuat sesuatu",
      "Teks yang menceritakan kisah imajinatif/masa lalu untuk menghibur",
      "Teks yang melaporkan hasil penelitian",
      "Teks yang berisi pendapat penulis tentang suatu isu"
    ],
    answer: 1
  },
  {
    team: "right",
    topic: "Definisi Narrative Text",
    q: "Narrative Text termasuk jenis teks...",
    options: [
      "Factual / informatif",
      "Imajinatif / storytelling",
      "Prosedural",
      "Deskriptif ilmiah"
    ],
    answer: 1
  },
  {
    team: "left",
    topic: "Tujuan Narrative Text",
    q: "Apa tujuan utama (social function) dari Narrative Text?",
    options: [
      "To describe a particular place",
      "To amuse/entertain the readers with a story",
      "To explain how something works",
      "To persuade readers to do something"
    ],
    answer: 1
  },
  {
    team: "right",
    topic: "Tujuan Narrative Text",
    q: "Selain menghibur, narrative text juga bertujuan untuk...",
    options: [
      "Memberikan langkah-langkah",
      "Menyampaikan pesan moral (moral value)",
      "Mendeskripsikan ciri fisik",
      "Melaporkan kejadian aktual harian"
    ],
    answer: 1
  },
  {
    team: "left",
    topic: "Generic Structure",
    q: "Urutan struktur umum Narrative Text yang benar adalah...",
    options: [
      "Orientation – Events – Re-orientation",
      "Orientation – Complication – Resolution",
      "Goal – Materials – Steps",
      "Identification – Description"
    ],
    answer: 1
  },
  {
    team: "right",
    topic: "Generic Structure",
    q: "Bagian yang memperkenalkan tokoh, waktu, dan tempat disebut...",
    options: [
      "Complication",
      "Resolution",
      "Orientation",
      "Coda"
    ],
    answer: 2
  },
  {
    team: "left",
    topic: "Language Features",
    q: "Ciri kebahasaan Narrative Text yang BENAR adalah...",
    options: [
      "Menggunakan Simple Present Tense",
      "Menggunakan Simple Past Tense",
      "Menggunakan imperative sentences",
      "Menggunakan general nouns"
    ],
    answer: 1
  },
  {
    team: "right",
    topic: "Language Features",
    q: "Kata penghubung waktu seperti 'then', 'after that', 'finally' dalam narrative text disebut...",
    options: [
      "Action verbs",
      "Temporal conjunctions",
      "Adjectives",
      "Reporting verbs"
    ],
    answer: 1
  },
  {
    team: "left",
    topic: "Identifikasi Cerita",
    q: "Manakah yang BUKAN termasuk contoh Narrative Text?",
    options: [
      "Cinderella",
      "Malin Kundang",
      "How to Make Fried Rice",
      "The Legend of Toba Lake"
    ],
    answer: 2
  },
  {
    team: "right",
    topic: "Identifikasi Cerita",
    q: "Bagian cerita di mana masalah utama terselesaikan disebut...",
    options: [
      "Orientation",
      "Complication",
      "Resolution",
      "Evaluation"
    ],
    answer: 2
  }
];

let currentIndex = 0;
let ropePosition = 0;
let scoreLeft = 0;
let scoreRight = 0;

const flag = document.getElementById('flag');
const optionsDiv = document.getElementById('options');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const progress = document.getElementById('progress');
const turnLabel = document.getElementById('turnLabel');
const qNumber = document.getElementById('qNumber');
const qText = document.getElementById('qText');

function updateRope() {
  const percent = 50 + (ropePosition / 2);
  flag.style.left = percent + "%";
}

function renderQuestion() {
  const question = questions[currentIndex];
  const isLeft = question.team === "left";
  const teamName = isLeft ? "Tim Kiri" : "Tim Kanan";

  turnLabel.textContent = isLeft ? "⬅ GILIRAN TIM KIRI" : "GILIRAN TIM KANAN ➡";
  turnLabel.className = "turn-label " + (isLeft ? "turn-left" : "turn-right");
  qNumber.textContent = `Soal ${Math.floor(currentIndex / 2) + 1} dari 5 untuk ${teamName} • Topik: ${question.topic}`;
  qText.textContent = question.q;
  progress.textContent = `Skor: Kiri ${scoreLeft} — Kanan ${scoreRight}`;

  optionsDiv.replaceChildren();
  question.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.className = 'option';
    button.type = 'button';
    button.textContent = String.fromCharCode(65 + index) + ". " + option;
    button.addEventListener('click', () => selectAnswer(index, button));
    optionsDiv.appendChild(button);
  });

  feedback.classList.add('hidden');
  nextBtn.classList.add('hidden');
}

function selectAnswer(index, selectedButton) {
  const question = questions[currentIndex];
  const buttons = optionsDiv.querySelectorAll('.option');
  buttons.forEach(button => button.disabled = true);

  const isCorrect = index === question.answer;
  const pullLeft = (question.team === "left" && isCorrect) ||
    (question.team === "right" && !isCorrect);

  if (isCorrect) {
    selectedButton.classList.add('correct');
    feedback.textContent = `✅ BENAR! Tali bergerak ke arah ${pullLeft ? "KIRI" : "KANAN"}!`;
    feedback.className = "feedback correct";
    if (question.team === "left") scoreLeft++;
    else scoreRight++;
  } else {
    selectedButton.classList.add('wrong');
    buttons[question.answer].classList.add('correct');
    feedback.textContent = `❌ SALAH! Tali bergerak ke arah ${pullLeft ? "KIRI" : "KANAN"}!`;
    feedback.className = "feedback wrong";
  }

  ropePosition += pullLeft ? -20 : 20;
  ropePosition = Math.max(-100, Math.min(100, ropePosition));
  updateRope();
  document.getElementById('scoreLeft').textContent = scoreLeft;
  document.getElementById('scoreRight').textContent = scoreRight;
  progress.textContent = `Skor: Kiri ${scoreLeft} — Kanan ${scoreRight}`;

  feedback.classList.remove('hidden');
  nextBtn.classList.remove('hidden');
}

nextBtn.addEventListener('click', () => {
  currentIndex++;
  if (currentIndex >= questions.length) endGame();
  else renderQuestion();
});

function endGame() {
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('winnerArea').classList.remove('hidden');
  const winnerText = document.getElementById('winnerText');
  document.getElementById('finalScore').textContent =
    `Skor Akhir — Tim Kiri: ${scoreLeft} | Tim Kanan: ${scoreRight}`;

  if (scoreLeft > scoreRight) {
    winnerText.textContent = "🎉 TIM KIRI MENANG! 🎉";
    winnerText.style.color = "#1976D2";
  } else if (scoreRight > scoreLeft) {
    winnerText.textContent = "🎉 TIM KANAN MENANG! 🎉";
    winnerText.style.color = "#D32F2F";
  } else {
    winnerText.textContent = "🤝 SERI! Dua-duanya Hebat!";
    winnerText.style.color = "#FFA000";
  }
}

updateRope();
renderQuestion();
</script>
</body>
</html>
