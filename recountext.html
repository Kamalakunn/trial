// Game Interaktif Recount Text - Single HTML File
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recount Text Adventure - Belajar Bahasa Inggris</title>
<style>
/* === RESET & BASE === */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: #333;
  overflow-x: hidden;
}

/* === CONTAINER === */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 15px;
  min-height: 100vh;
}

/* === HEADER BAR === */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  padding: 10px 20px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  flex-wrap: wrap;
  gap: 8px;
}

.header-bar .hearts { font-size: 1.2em; }
.header-bar .score { font-weight: bold; color: #764ba2; font-size: 1.1em; }
.header-bar .level-info { color: #555; font-size: 0.9em; }

/* === SCREENS === */
.screen { display: none; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === MENU SCREEN === */
.menu-screen {
  text-align: center;
  padding-top: 30px;
}

.menu-screen h1 {
  color: #fff;
  font-size: 2.2em;
  margin-bottom: 5px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.menu-screen .subtitle {
  color: rgba(255,255,255,0.9);
  font-size: 1.1em;
  margin-bottom: 30px;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.level-card {
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 25px 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
  position: relative;
  overflow: hidden;
}

.level-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.level-card.locked {
  opacity: 0.6;
  cursor: not-allowed;
}

.level-card .level-icon {
  font-size: 3em;
  margin-bottom: 10px;
}

.level-card h3 {
  color: #764ba2;
  margin-bottom: 8px;
  font-size: 1.2em;
}

.level-card p {
  color: #666;
  font-size: 0.9em;
  line-height: 1.4;
}

.level-card .stars-display {
  margin-top: 10px;
  font-size: 1.3em;
}

/* === GAME AREA === */
.game-card {
  background: rgba(255,255,255,0.97);
  border-radius: 20px;
  padding: 25px 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.15);
  margin-bottom: 15px;
}

.game-card h2 {
  color: #764ba2;
  margin-bottom: 5px;
  font-size: 1.4em;
}

.game-card .question-number {
  color: #999;
  font-size: 0.9em;
  margin-bottom: 15px;
}

.game-card .question-text {
  font-size: 1.1em;
  line-height: 1.6;
  margin-bottom: 20px;
  color: #444;
}

.game-card .question-text em {
  color: #764ba2;
  font-weight: bold;
}

/* === OPTIONS === */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option-btn {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 15px;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  font-weight: 500;
}

.option-btn:hover {
  border-color: #764ba2;
  transform: scale(1.02);
}

.option-btn.correct {
  background: linear-gradient(135deg, #a8edea 0%, #56ab2f 100%);
  color: #fff;
  border-color: #56ab2f;
  animation: pulse 0.5s ease;
}

.option-btn.wrong {
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  color: #c0392b;
  border-color: #e74c3c;
  animation: shake 0.5s ease;
}

.option-btn:disabled { cursor: not-allowed; opacity: 0.7; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* === FEEDBACK === */
.feedback {
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  font-size: 0.95em;
  line-height: 1.5;
  display: none;
  animation: fadeIn 0.3s ease;
}

.feedback.show { display: block; }
.feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #56ab2f; }
.feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #e74c3c; }

/* === BUTTONS === */
.btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 12px 30px;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  margin: 5px;
}

.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(118,75,162,0.4); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-secondary {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

.btn-success {
  background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
}

/* === STORY SORTER (Level 2) === */
.story-container {
  margin-bottom: 15px;
}

.sentence-pool {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.sentence-item {
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  border: 2px solid #fcb69f;
  border-radius: 10px;
  padding: 12px 15px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.95em;
  line-height: 1.4;
}

.sentence-item:hover { transform: translateX(5px); border-color: #764ba2; }
.sentence-item.selected {
  background: linear-gradient(135deg, #a8edea 0%, #56ab2f 100%);
  color: #fff;
  border-color: #56ab2f;
  opacity: 0.7;
}

.sentence-item.placed {
  background: #e8e8e8;
  opacity: 0.4;
  cursor: default;
}

.answer-area {
  min-height: 100px;
  border: 2px dashed #764ba2;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.answer-area h4 {
  color: #764ba2;
  margin-bottom: 10px;
  font-size: 0.9em;
}

.placed-sentence {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 0.9em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.placed-sentence .remove-btn {
  background: rgba(255,255,255,0.3);
  border: none;
  color: #fff;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  cursor: pointer;
  font-size: 0.8em;
  flex-shrink: 0;
}

/* === STRUCTURE DETECTIVE (Level 3) === */
.paragraph-block {
  background: #f8f9fa;
  border: 2px solid #dee2e6;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  transition: border-color 0.3s;
}

.paragraph-block.answered-correct { border-color: #56ab2f; background: #f0fff0; }
.paragraph-block.answered-wrong { border-color: #e74c3c; background: #fff0f0; }

.paragraph-block p {
  font-size: 0.95em;
  line-height: 1.6;
  margin-bottom: 12px;
  color: #444;
}

.structure-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.structure-btn {
  padding: 8px 16px;
  border: 2px solid #764ba2;
  background: #fff;
  color: #764ba2;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85em;
  font-weight: 600;
  transition: all 0.2s;
}

.structure-btn:hover { background: #764ba2; color: #fff; }
.structure-btn.selected { background: #764ba2; color: #fff; }

/* === FILL IN BLANK (Level 4) === */
.story-text {
  font-size: 1em;
  line-height: 2;
  color: #444;
  margin-bottom: 15px;
}

.blank-input {
  border: none;
  border-bottom: 2px solid #764ba2;
  background: #f0e6ff;
  padding: 4px 8px;
  font-size: 0.95em;
  width: 120px;
  text-align: center;
  border-radius: 4px 4px 0 0;
  outline: none;
  transition: all 0.2s;
}

.blank-input:focus { border-bottom-color: #667eea; background: #e6d4ff; }
.blank-input.correct { background: #d4edda; border-bottom-color: #56ab2f; }
.blank-input.wrong { background: #f8d7da; border-bottom-color: #e74c3c; }

.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 12px;
  margin-bottom: 15px;
}

.word-chip {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85em;
  cursor: pointer;
  transition: all 0.2s;
}

.word-chip:hover { transform: scale(1.05); }
.word-chip.used { opacity: 0.3; cursor: default; }

/* === TIMER === */
.timer-bar {
  height: 6px;
  background: #e0e0e0;
  border-radius: 3px;
  margin-bottom: 15px;
  overflow: hidden;
}

.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #43e97b, #38f9d7);
  border-radius: 3px;
  transition: width 1s linear;
  width: 100%;
}

.timer-fill.warning { background: linear-gradient(90deg, #f5576c, #fcb69f); }

/* === RESULTS SCREEN === */
.results-screen {
  text-align: center;
  padding-top: 20px;
}

.results-card {
  background: rgba(255,255,255,0.97);
  border-radius: 20px;
  padding: 30px 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.15);
  margin-bottom: 15px;
}

.results-card h2 {
  color: #764ba2;
  font-size: 1.8em;
  margin-bottom: 10px;
}

.final-score {
  font-size: 3em;
  font-weight: bold;
  color: #667eea;
  margin: 15px 0;
}

.stars-result {
  font-size: 2.5em;
  margin: 15px 0;
}

.level-summary {
  text-align: left;
  margin: 20px 0;
}

.level-summary-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid #eee;
}

.level-summary-item .level-name { font-weight: 600; color: #555; }
.level-summary-item .level-stars { font-size: 1.2em; }

.topics-review {
  text-align: left;
  background: #fff3cd;
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0;
}

.topics-review h4 { color: #856404; margin-bottom: 8px; }
.topics-review ul { list-style: none; padding: 0; }
.topics-review li { padding: 4px 0; color: #856404; font-size: 0.9em; }
.topics-review li::before { content: "📌 "; }

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .menu-screen h1 { font-size: 1.6em; }
  .options-grid { grid-template-columns: 1fr; }
  .container { padding: 10px; }
  .game-card { padding: 18px 15px; }
  .header-bar { padding: 8px 12px; font-size: 0.9em; }
  .blank-input { width: 90px; }
}

/* === CONFETTI === */
.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: confettiFall 3s ease-out forwards;
}

@keyframes confettiFall {
  to {
    top: 110%;
    transform: rotate(720deg);
  }
}

/* === TOOLTIP === */
.info-badge {
  display: inline-block;
  background: #764ba2;
  color: #fff;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 0.7em;
  line-height: 20px;
  text-align: center;
  cursor: help;
  margin-left: 5px;
}

/* === PROGRESS === */
.progress-bar {
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  margin-bottom: 15px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 4px;
  transition: width 0.5s ease;
}
</style>
</head>
<body>

<div class="container">
  <!-- HEADER BAR -->
  <div class="header-bar" id="headerBar" style="display:none;">
    <div class="hearts" id="heartsDisplay">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
    <div class="score">Skor: <span id="scoreDisplay">0</span></div>
    <div class="level-info" id="levelInfo"></div>
  </div>

  <!-- MENU SCREEN -->
  <div class="screen active" id="menuScreen">
    <div class="menu-screen">
      <h1>🎮 Recount Text Adventure</h1>
      <p class="subtitle">Belajar Bahasa Inggris dengan cara seru!</p>
      
      <div class="level-grid" id="levelGrid">
        <!-- Level cards generated by JS -->
      </div>

      <button class="btn" onclick="resetGame()">🔄 Reset Semua Progress</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div class="game-card">
      <div class="timer-bar" id="timerBar" style="display:none;">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <h2 id="gameTitle"></h2>
      <p class="question-number" id="questionNumber"></p>
      <div id="gameContent"></div>
      <div class="feedback" id="feedback"></div>
      <div style="text-align:center; margin-top:15px;">
        <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">Lanjut ➡️</button>
      </div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="screen" id="resultsScreen">
    <div class="results-screen">
      <div class="results-card">
        <h2 id="resultsTitle">🎉 Selesai!</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="stars-result" id="starsResult"></div>
        <p id="resultsMessage"></p>
        
        <div class="level-summary" id="levelSummary"></div>
        <div class="topics-review" id="topicsReview" style="display:none;">
          <h4>📚 Topik yang Perlu Diulang:</h4>
          <ul id="topicsList"></ul>
        </div>

        <button class="btn btn-success" onclick="showMenu()">🏠 Kembali ke Menu</button>
        <button class="btn btn-secondary" onclick="replayLevel()">🔁 Main Lagi Level Ini</button>
      </div>
    </div>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script>
// ============================================================
// GAME STATE
// ============================================================
let gameState = {
  lives: 10,
  score: 0,
  currentLevel: 0,
  currentQuestion: 0,
  questions: [],
  levelScores: [0, 0, 0, 0],
  levelStars: [0, 0, 0, 0],
  levelCompleted: [false, false, false, false],
  answeredCorrectly: [],
  timerInterval: null,
  timeLeft: 0
};

// ============================================================
// CONTENT DATABASE
// ============================================================

// LEVEL 1: VERB HUNTER - 12 soal
const verbHunterQuestions = [
  { base: "go", options: ["goed", "went", "gone", "going"], answer: 1, explanation: "'Go' adalah irregular verb. Bentuk past tense-nya adalah 'went'." },
  { base: "play", options: ["played", "plaied", "playing", "plays"], answer: 0, explanation: "'Play' adalah regular verb. Tambahkan '-ed' menjadi 'played'." },
  { base: "eat", options: ["eated", "ate", "eaten", "eating"], answer: 1, explanation: "'Eat' adalah irregular verb. Bentuk past tense-nya adalah 'ate'." },
  { base: "visit", options: ["visitted", "visiting", "visited", "visits"], answer: 2, explanation: "'Visit' adalah regular verb. Tambahkan '-ed' menjadi 'visited'." },
  { base: "swim", options: ["swimmed", "swam", "swum", "swimming"], answer: 1, explanation: "'Swim' adalah irregular verb. Bentuk past tense-nya adalah 'swam'." },
  { base: "buy", options: ["buyed", "bought", "boughted", "buying"], answer: 1, explanation: "'Buy' adalah irregular verb. Bentuk past tense-nya adalah 'bought'." },
  { base: "write", options: ["writed", "written", "wrote", "writing"], answer: 2, explanation: "'Write' adalah irregular verb. Bentuk past tense-nya adalah 'wrote'." },
  { base: "take", options: ["taked", "taken", "took", "taking"], answer: 2, explanation: "'Take' adalah irregular verb. Bentuk past tense-nya adalah 'took'." },
  { base: "see", options: ["seed", "saw", "seen", "seeing"], answer: 1, explanation: "'See' adalah irregular verb. Bentuk past tense-nya adalah 'saw'." },
  { base: "come", options: ["comed", "came", "come", "coming"], answer: 1, explanation: "'Come' adalah irregular verb. Bentuk past tense-nya adalah 'came'." },
  { base: "study", options: ["studyed", "studied", "studying", "studies"], answer: 1, explanation: "'Study' adalah regular verb. Huruf 'y' berubah jadi 'i' lalu tambah '-ed' menjadi 'studied'." },
  { base: "have", options: ["haved", "had", "having", "has"], answer: 1, explanation: "'Have' adalah irregular verb. Bentuk past tense-nya adalah 'had'." }
];

// LEVEL 2: STORY SORTER - 3 cerita
const storySorterData = [
  {
    title: "My Holiday in Bali",

    correctOrder: [0, 1, 2, 3, 4, 5, 6]

  {

    correctOrder: [0, 1, 2, 3, 4, 5, 6, 7]

// LEVEL 3: STRUCTURE DETECTIVE - 3 teks
const structureDetectiveData = [
  {
    title: "A Memorable Birthday Party",
    paragraphs: [
      "Last month was my 16th birthday. My parents organized a small party at our house on Saturday evening. They invited my closest friends and some relatives.",

      "I was so happy and grateful for the wonderful party. It was one of the best birthdays I have ever had. I will always remember that special day."

  {

      "Although I did not win first place, I was proud of myself. I learned that trying something new is more important than winning. The experience taught me to be more confident."
    ],
    answers: ["Orientation", "Events", "Re-orientation"]
  }
];

// LEVEL 4: COMPLETE MY STORY - 2 cerita
const completeStoryData = [
  {
    title: "My Holiday in Bandung",
    text: "Last holiday, my family ___(1)___ to Bandung. We ___(2)___ there by car early in the morning. ___(3)___, we visited Kawah Putih and enjoyed the beautiful view. ___(4)___, we went to a factory outlet and bought some clothes. ___(5)___, we tried batagor and cuankie, the delicious local food. It ___(6)___ a wonderful holiday and I ___(7)___ every moment of it.",
    blanks: [
      { answer: "went", hint: "go → ?" },

// ============================================================
// LEVEL CONFIG
// ============================================================
const levels = [
  { name: "Verb Hunter", icon: "🔤", desc: "Pilih bentuk past tense yang benar dari kata kerja!", questions: 10 },
  { name: "Story Sorter", icon: "📝", desc: "Susun kalimat acak menjadi recount text yang runtut!", questions: 3 },
  { name: "Structure Detective", icon: "🔍", desc: "Tandai tiap paragraf: Orientation, Events, atau Re-orientation!", questions: 3 },
  { name: "Complete My Story", icon: "✍️", desc: "Lengkapi recount text dengan kata yang tepat!", questions: 2 }
];

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function shuffleArray(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateHeader() {
  const hearts = '❤️'.repeat(gameState.lives) + '🖤'.repeat(10 - gameState.lives);
  document.getElementById('heartsDisplay').textContent = hearts;
  document.getElementById('scoreDisplay').textContent = gameState.score;
}

function showConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#667eea', '#764ba2', '#f5576c', '#43e97b', '#fcb69f', '#ffecd2'];
  for (let i = 0; i < 50; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = Math.random() * 100 + '%';
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.animationDelay = Math.random() * 2 + 's';
    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    container.appendChild(conf);
  }
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

function calculateStars(score, maxScore) {
  const pct = score / maxScore;
  if (pct >= 0.9) return 3;
  if (pct >= 0.7) return 2;
  if (pct >= 0.4) return 1;
  return 0;
}

// ============================================================
// MENU
// ============================================================
function renderMenu() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  levels.forEach((lv, i) => {
    const locked = i > 0 && !gameState.levelCompleted[i - 1];
    const stars = '⭐'.repeat(gameState.levelStars[i]) + '☆'.repeat(3 - gameState.levelStars[i]);
    const card = document.createElement('div');
    card.className = 'level-card' + (locked ? ' locked' : '');
    card.innerHTML = `
      <div class="level-icon">${lv.icon}</div>
      <h3>Level ${i + 1}: ${lv.name}</h3>
      <p>${lv.desc}</p>
      <div class="stars-display">${gameState.levelCompleted[i] ? stars : (locked ? '🔒 Selesaikan level sebelumnya' : '▶️ Mulai')}</div>
    `;
    if (!locked) card.onclick = () => startLevel(i);
    grid.appendChild(card);
  });
}

function showMenu() {
  document.getElementById('headerBar').style.display = 'none';
  showScreen('menuScreen');
  renderMenu();
}

function resetGame() {
  if (confirm('Yakin ingin reset semua progress?')) {
    gameState = {
      lives: 10, score: 0, currentLevel: 0, currentQuestion: 0,
      questions: [], levelScores: [0, 0, 0, 0], levelStars: [0, 0, 0, 0],
      levelCompleted: [false, false, false, false], answeredCorrectly: [],
      timerInterval: null, timeLeft: 0
    };
    renderMenu();
  }
}

// ============================================================
// START LEVEL
// ============================================================
function startLevel(levelIdx) {
  gameState.currentLevel = levelIdx;
  gameState.currentQuestion = 0;
  gameState.answeredCorrectly = [];
  gameState.lives = 10;
  updateHeader();
  document.getElementById('headerBar').style.display = 'flex';
  document.getElementById('levelInfo').textContent = `Level ${levelIdx + 1}: ${levels[levelIdx].name}`;

  showScreen('gameScreen');
  document.getElementById('gameTitle').textContent = `${levels[levelIdx].icon} ${levels[levelIdx].name}`;

  switch (levelIdx) {
    case 0: initVerbHunter(); break;
    case 1: initStorySorter(); break;
    case 2: initStructureDetective(); break;
    case 3: initCompleteStory(); break;
  }
}

// ============================================================
// LEVEL 1: VERB HUNTER
// ============================================================
function initVerbHunter() {
  gameState.questions = shuffleArray(verbHunterQuestions).slice(0, 10);
  loadVerbHunterQuestion();
}

function loadVerbHunterQuestion() {
  const q = gameState.questions[gameState.currentQuestion];
  const total = gameState.questions.length;
  document.getElementById('questionNumber').textContent = `Soal ${gameState.currentQuestion + 1} dari ${total}`;
  document.getElementById('progressFill').style.width = ((gameState.currentQuestion) / total * 100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  const content = document.getElementById('gameContent');
  content.innerHTML = `
    <div class="question-text">
      Apa bentuk <em>past tense</em> dari kata kerja: <strong>"${q.base}"</strong>?
    </div>
    <div class="options-grid" id="optionsGrid"></div>
  `;

  const grid = document.getElementById('optionsGrid');
  const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isAnswer: idx === q.answer }));
  // Shuffle options display
  const shuffledDisplay = shuffleArray(shuffledOptions);

  shuffledDisplay.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => handleVerbAnswer(btn, opt.isAnswer, q);
    grid.appendChild(btn);
  });

  startTimer(15);
}

function handleVerbAnswer(btn, isCorrect, q) {
  clearInterval(gameState.timerInterval);
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    btn.classList.add('correct');
    gameState.score += 10;
    gameState.answeredCorrectly.push(true);
    fb.className = 'feedback correct show';
    fb.innerHTML = `✅ <strong>Benar!</strong> ${q.explanation}`;
  } else {
    btn.classList.add('wrong');
    gameState.lives = Math.max(0, gameState.lives - 1);
    gameState.answeredCorrectly.push(false);
    // Highlight correct answer
    buttons.forEach(b => {
      if (b.textContent === q.options[q.answer]) b.classList.add('correct');
    });
    fb.className = 'feedback wrong show';
    fb.innerHTML = `❌ <strong>Kurang tepat.</strong> ${q.explanation}`;
  }
  updateHeader();
  document.getElementById('nextBtn').style.display = 'inline-block';
  checkGameOver();
}

// ============================================================
// LEVEL 2: STORY SORTER
// ============================================================
function initStorySorter() {
  gameState.questions = shuffleArray([...storySorterData]);
  gameState.sorterState = { currentStory: 0, selectedOrder: [], availableSentences: [] };
  loadStorySorterQuestion();
}

function loadStorySorterQuestion() {
  const story = gameState.questions[gameState.currentQuestion];
  const total = gameState.questions.length;
  document.getElementById('questionNumber').textContent = `Cerita ${gameState.currentQuestion + 1} dari ${total}: "${story.title}"`;
  document.getElementById('progressFill').style.width = ((gameState.currentQuestion) / total * 100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  // Shuffle sentences for the pool
  const indices = story.sentences.map((_, i) => i);
  const shuffled = shuffleArray(indices);

  gameState.sorterState.selectedOrder = [];
  gameState.sorterState.availableSentences = shuffled;

  const content = document.getElementById('gameContent');
  content.innerHTML = `
    <div class="question-text">
      Susun kalimat-kalimat berikut menjadi <em>recount text</em> yang runtut! Klik kalimat sesuai urutan yang benar.
    </div>
    <div class="story-container">
      <h4 style="color:#764ba2; margin-bottom:10px;">📋 Kalimat tersedia (klik untuk memilih):</h4>
      <div class="sentence-pool" id="sentencePool"></div>
      <h4 style="color:#764ba2; margin-bottom:10px;">📝 Urutan cerita kamu:</h4>
      <div class="answer-area" id="answerArea">
        <p style="color:#999; font-style:italic;">Klik kalimat di atas untuk menyusun cerita...</p>
      </div>
      <div style="text-align:center;">
        <button class="btn" onclick="checkStoryOrder()">✓ Periksa Jawaban</button>
        <button class="btn btn-secondary" onclick="resetStoryOrder()">🔄 Ulangi</button>
      </div>
    </div>
  `;

  renderSentencePool();
  startTimer(60);
}

function renderSentencePool() {
  const story = gameState.questions[gameState.currentQuestion];
  const pool = document.getElementById('sentencePool');
  pool.innerHTML = '';

  gameState.sorterState.availableSentences.forEach(idx => {
    const item = document.createElement('div');
    item.className = 'sentence-item';
    if (gameState.sorterState.selectedOrder.includes(idx)) {
      item.classList.add('placed');
    }
    item.textContent = story.sentences[idx];
    item.onclick = () => {
      if (!gameState.sorterState.selectedOrder.includes(idx)) {
        gameState.sorterState.selectedOrder.push(idx);
        renderSentencePool();
        renderAnswerArea();
      }
    };
    pool.appendChild(item);
  });

  renderAnswerArea();
}

function renderAnswerArea() {
  const story = gameState.questions[gameState.currentQuestion];
  const area = document.getElementById('answerArea');
  if (gameState.sorterState.selectedOrder.length === 0) {
    area.innerHTML = '<p style="color:#999; font-style:italic;">Klik kalimat di atas untuk menyusun cerita...</p>';
    return;
  }
  area.innerHTML = '';
  gameState.sorterState.selectedOrder.forEach((idx, pos) => {
    const div = document.createElement('div');
    div.className = 'placed-sentence';
    div.innerHTML = `
      <span><strong>${pos + 1}.</strong> ${story.sentences[idx]}</span>
      <button class="remove-btn" onclick="removeSentence(${pos})">✕</button>
    `;
    area.appendChild(div);
  });
}

function removeSentence(pos) {
  gameState.sorterState.selectedOrder.splice(pos, 1);
  renderSentencePool();
  renderAnswerArea();
}

function resetStoryOrder() {
  gameState.sorterState.selectedOrder = [];
  renderSentencePool();
}

function checkStoryOrder() {
  clearInterval(gameState.timerInterval);
  const story = gameState.questions[gameState.currentQuestion];
  const userOrder = gameState.sorterState.selectedOrder;

  if (userOrder.length !== story.sentences.length) {
    alert('Susun semua kalimat terlebih dahulu!');
    return;
  }

  const fb = document.getElementById('feedback');
  const isCorrect = JSON.stringify(userOrder) === JSON.stringify(story.correctOrder);

  if (isCorrect) {
    gameState.score += 20;
    gameState.answeredCorrectly.push(true);
    fb.className = 'feedback correct show';
    fb.innerHTML = `✅ <strong>Sempurna!</strong> Susunan ceritamu sudah benar dan runtut. Recount text harus memiliki urutan kejadian yang jelas menggunakan time connectors.`;
  } else {
    gameState.lives = Math.max(0, gameState.lives - 1);
    gameState.answeredCorrectly.push(false);
    fb.className = 'feedback wrong show';
    // Show correct order
    let correctText = story.correctOrder.map((idx, i) => `${i + 1}. ${story.sentences[idx]}`).join('<br>');
    fb.innerHTML = `❌ <strong>Urutan belum tepat.</strong> Perhatikan penggunaan time connectors seperti <em>first, then, after that, finally</em> untuk menentukan urutan.<br><br><strong>Urutan yang benar:</strong><br>${correctText}`;
  }
  updateHeader();
  document.getElementById('nextBtn').style.display = 'inline-block';
  checkGameOver();
}

// ============================================================
// LEVEL 3: STRUCTURE DETECTIVE
// ============================================================
function initStructureDetective() {
  gameState.questions = shuffleArray([...structureDetectiveData]);
  gameState.structureState = { currentText: 0, answers: [] };
  loadStructureQuestion();
}

function loadStructureQuestion() {
  const text = gameState.questions[gameState.currentQuestion];
  const total = gameState.questions.length;
  document.getElementById('questionNumber').textContent = `Teks ${gameState.currentQuestion + 1} dari ${total}: "${text.title}"`;
  document.getElementById('progressFill').style.width = ((gameState.currentQuestion) / total * 100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  gameState.structureState.answers = new Array(text.paragraphs.length).fill(null);

  const content = document.getElementById('gameContent');
  let html = `
    <div class="question-text">
      Baca teks recount berikut, lalu tentukan struktur tiap paragraf: <em>Orientation</em>, <em>Events</em>, atau <em>Re-orientation</em>.
    </div>
  `;

  text.paragraphs.forEach((para, i) => {
    html += `
      <div class="paragraph-block" id="para-${i}">
        <p><strong>Paragraf ${i + 1}:</strong> ${para}</p>
        <div class="structure-options" id="opts-${i}">
          <button class="structure-btn" onclick="selectStructure(${i}, 'Orientation')">📍 Orientation</button>
          <button class="structure-btn" onclick="selectStructure(${i}, 'Events')">📋 Events</button>
          <button class="structure-btn" onclick="selectStructure(${i}, 'Re-orientation')">💭 Re-orientation</button>
        </div>
      </div>
    `;
  });

  html += `<div style="text-align:center;"><button class="btn" onclick="checkStructure()">✓ Periksa Jawaban</button></div>`;
  content.innerHTML = html;
  startTimer(90);
}

function selectStructure(paraIdx, structure) {
  gameState.structureState.answers[paraIdx] = structure;
  const opts = document.getElementById(`opts-${paraIdx}`).children;
  for (let btn of opts) {
    btn.classList.remove('selected');
    if (btn.textContent.includes(structure)) btn.classList.add('selected');
  }
}

function checkStructure() {
  clearInterval(gameState.timerInterval);
  const text = gameState.questions[gameState.currentQuestion];
  const userAnswers = gameState.structureState.answers;

  if (userAnswers.includes(null)) {
    alert('Tandai semua paragraf terlebih dahulu!');
    return;
  }

  const fb = document.getElementById('feedback');
  let correctCount = 0;
  let explanations = [];

  userAnswers.forEach((ans, i) => {
    const block = document.getElementById(`para-${i}`);
    if (ans === text.answers[i]) {
      block.classList.add('answered-correct');
      correctCount++;
    } else {
      block.classList.add('answered-wrong');
      explanations.push(`Paragraf ${i + 1}: seharusnya <strong>${text.answers[i]}</strong>`);
    }
  });

  if (correctCount === text.paragraphs.length) {
    gameState.score += 20;
    gameState.answeredCorrectly.push(true);
    fb.className = 'feedback correct show';
    fb.innerHTML = `✅ <strong>Sempurna!</strong> Semua struktur sudah benar.<br>• <strong>Orientation:</strong> memperkenalkan siapa, kapan, di mana<br>• <strong>Events:</strong> urutan kejadian<br>• <strong>Re-orientation:</strong> kesimpulan/komentar penulis`;
  } else {
    gameState.lives = Math.max(0, gameState.lives - 1);
    gameState.answeredCorrectly.push(false);
    fb.className = 'feedback wrong show';
    fb.innerHTML = `❌ <strong>${correctCount}/${text.paragraphs.length} benar.</strong><br>${explanations.join('<br>')}<br><br><strong>Pengingat:</strong><br>• <strong>Orientation:</strong> memperkenalkan siapa, kapan, di mana<br>• <strong>Events:</strong> urutan kejadian<br>• <strong>Re-orientation:</strong> kesimpulan/komentar penulis`;
  }
  updateHeader();
  document.getElementById('nextBtn').style.display = 'inline-block';
  checkGameOver();
}

// ============================================================
// LEVEL 4: COMPLETE MY STORY
// ============================================================
function initCompleteStory() {
  gameState.questions = shuffleArray([...completeStoryData]);
  gameState.completeState = { currentStory: 0 };
  loadCompleteStoryQuestion();
}

function loadCompleteStoryQuestion() {
  const story = gameState.questions[gameState.currentQuestion];
  const total = gameState.questions.length;
  document.getElementById('questionNumber').textContent = `Cerita ${gameState.currentQuestion + 1} dari ${total}: "${story.title}"`;
  document.getElementById('progressFill').style.width = ((gameState.currentQuestion) / total * 100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  // Build text with blank inputs
  let textHtml = story.text;
  story.blanks.forEach((blank, i) => {
    textHtml = textHtml.replace(`___(${i + 1})___`, `<input type="text" class="blank-input" id="blank-${i}" placeholder="${blank.hint}" autocomplete="off">`);
  });

  // Shuffle word bank
  const shuffledBank = shuffleArray([...story.wordBank]);

  const content = document.getElementById('gameContent');
  content.innerHTML = `
    <div class="question-text">
      Lengkapi recount text berikut dengan kata yang tepat. Gunakan petunjuk di dalam kurung!
    </div>
    <div class="story-text">${textHtml}</div>
    <h4 style="color:#764ba2; margin-bottom:8px;">💡 Word Bank (klik untuk mengisi):</h4>
    <div class="word-bank" id="wordBank">
      ${shuffledBank.map(w => `<span class="word-chip" onclick="fillFromBank('${w}')">${w}</span>`).join('')}
    </div>
    <div style="text-align:center;">
      <button class="btn" onclick="checkCompleteStory()">✓ Periksa Jawaban</button>
    </div>
  `;

  startTimer(120);
}

let activeBlank = null;
document.addEventListener('focusin', (e) => {
  if (e.target.classList.contains('blank-input')) {
    activeBlank = e.target.id;
  }
});

function fillFromBank(word) {
  if (activeBlank) {
    const input = document.getElementById(activeBlank);
    input.value = word;
    input.focus();
  } else {
    // Fill first empty blank
    const blanks = document.querySelectorAll('.blank-input');
    for (let b of blanks) {
      if (!b.value.trim()) {
        b.value = word;
        b.focus();
        activeBlank = b.id;
        break;
      }
    }
  }
}

function checkCompleteStory() {
  clearInterval(gameState.timerInterval);
  const story = gameState.questions[gameState.currentQuestion];
  const fb = document.getElementById('feedback');
  let correctCount = 0;
  let wrongBlanks = [];

  story.blanks.forEach((blank, i) => {
    const input = document.getElementById(`blank-${i}`);
    const userAnswer = input.value.trim().toLowerCase();
    const correctAnswer = blank.answer.toLowerCase();

    if (userAnswer === correctAnswer) {
      input.classList.add('correct');
      input.classList.remove('wrong');
      correctCount++;
    } else {
      input.classList.add('wrong');
      input.classList.remove('correct');
      wrongBlanks.push({ num: i + 1, correct: blank.answer, hint: blank.hint });
    }
    input.disabled = true;
  });

  if (correctCount === story.blanks.length) {
    gameState.score += 25;
    gameState.answeredCorrectly.push(true);
    fb.className = 'feedback correct show';
    fb.innerHTML = `✅ <strong>Sempurna!</strong> Semua isian sudah benar. Kamu memahami penggunaan past tense dan time connectors dengan baik!`;
  } else {
    gameState.lives = Math.max(0, gameState.lives - 1);
    gameState.answeredCorrectly.push(false);
    let wrongText = wrongBlanks.map(w => `<br>• Bagian (${w.num}): seharusnya "<strong>${w.correct}</strong>" (${w.hint})`).join('');
    fb.className = 'feedback wrong show';
    fb.innerHTML = `❌ <strong>${correctCount}/${story.blanks.length} benar.</strong>${wrongText}<br><br><strong>Tips:</strong> Perhatikan konteks kalimat. Gunakan past tense untuk kejadian masa lalu dan time connectors untuk menghubungkan urutan kejadian.`;
  }
  updateHeader();
  document.getElementById('nextBtn').style.display = 'inline-block';
  checkGameOver();
}

// ============================================================
// TIMER
// ============================================================
function startTimer(seconds) {
  clearInterval(gameState.timerInterval);
  const timerBar = document.getElementById('timerBar');
  const timerFill = document.getElementById('timerFill');
  timerBar.style.display = 'block';
  timerFill.style.width = '100%';
  timerFill.classList.remove('warning');
  gameState.timeLeft = seconds;

  gameState.timerInterval = setInterval(() => {
    gameState.timeLeft--;
    const pct = (gameState.timeLeft / seconds) * 100;
    timerFill.style.width = pct + '%';
    if (pct < 30) timerFill.classList.add('warning');

    if (gameState.timeLeft <= 0) {
      clearInterval(gameState.timerInterval);
      handleTimeUp();
    }
  }, 1000);
}

function handleTimeUp() {
  // Auto-wrong answer
  gameState.lives = Math.max(0, gameState.lives - 1);
  gameState.answeredCorrectly.push(false);
  const fb = document.getElementById('feedback');
  fb.className = 'feedback wrong show';
  fb.innerHTML = `⏰ <strong>Waktu habis!</strong> Kamu kehilangan 1 nyawa. Jangan khawatir, coba lagi di soal berikutnya!`;
  updateHeader();
  document.getElementById('nextBtn').style.display = 'inline-block';

  // Disable all inputs
  document.querySelectorAll('.option-btn, .blank-input').forEach(el => el.disabled = true);
  checkGameOver();
}

// ============================================================
// NAVIGATION & GAME OVER
// ============================================================
function nextQuestion() {
  gameState.currentQuestion++;
  const total = gameState.questions.length;

  if (gameState.currentQuestion >= total) {
    finishLevel();
  } else {
    switch (gameState.currentLevel) {
      case 0: loadVerbHunterQuestion(); break;
      case 1: loadStorySorterQuestion(); break;
      case 2: loadStructureQuestion(); break;
      case 3: loadCompleteStoryQuestion(); break;
    }
  }
}

function checkGameOver() {
  if (gameState.lives <= 0) {
    clearInterval(gameState.timerInterval);
    setTimeout(() => finishLevel(true), 1500);
  }
}

function finishLevel(gameOver = false) {
  clearInterval(gameState.timerInterval);
  const lvl = gameState.currentLevel;
  const correctCount = gameState.answeredCorrectly.filter(x => x).length;
  const total = gameState.questions.length;
  const maxScore = total * (lvl === 0 ? 10 : lvl === 1 ? 20 : lvl === 2 ? 20 : 25);

  // Calculate stars based on this level's performance
  const stars = calculateStars(correctCount, total);
  gameState.levelStars[lvl] = Math.max(gameState.levelStars[lvl], stars);

  if (!gameOver && correctCount >= Math.ceil(total * 0.4)) {
    gameState.levelCompleted[lvl] = true;
  }

  // Show results
  showScreen('resultsScreen');
  document.getElementById('headerBar').style.display = 'none';

  const starsDisplay = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('finalScore').textContent = `${correctCount}/${total}`;
  document.getElementById('starsResult').textContent = starsDisplay;

  if (gameOver) {
    document.getElementById('resultsTitle').textContent = '💔 Nyawa Habis!';
    document.getElementById('resultsMessage').textContent = 'Jangan menyerah! Ayo coba lagi dan pelajari materi yang sulit.';
  } else if (stars === 3) {
    document.getElementById('resultsTitle').textContent = '🏆 Luar Biasa!';
    document.getElementById('resultsMessage').textContent = 'Kamu menguasai level ini dengan sempurna!';
    showConfetti();
  } else if (stars >= 2) {
    document.getElementById('resultsTitle').textContent = '🎉 Bagus Sekali!';
    document.getElementById('resultsMessage').textContent = 'Kamu hampir sempurna! Terus berlatih ya!';
  } else if (stars >= 1) {
    document.getElementById('resultsTitle').textContent = '👍 Cukup Baik!';
    document.getElementById('resultsMessage').textContent = 'Kamu berhasil! Tapi masih ada yang perlu diperbaiki.';
  } else {
    document.getElementById('resultsTitle').textContent = '💪 Jangan Menyerah!';
    document.getElementById('resultsMessage').textContent = 'Coba lagi ya! Belajar dari kesalahan itu penting.';
  }

  // Level summary
  const summary = document.getElementById('levelSummary');
  summary.innerHTML = '<h4 style="margin-bottom:10px; color:#555;">📊 Ringkasan Level:</h4>';
  levels.forEach((lv, i) => {
    const s = '⭐'.repeat(gameState.levelStars[i]) + '☆'.repeat(3 - gameState.levelStars[i]);
    const status = gameState.levelCompleted[i] ? '✅' : (i === lvl ? '❌' : '🔒');
    summary.innerHTML += `
      <div class="level-summary-item">
        <span class="level-name">${status} Level ${i + 1}: ${lv.name}</span>
        <span class="level-stars">${s}</span>
      </div>
    `;
  });

  // Topics to review
  const topicsReview = document.getElementById('topicsReview');
  const topicsList = document.getElementById('topicsList');
  topicsList.innerHTML = '';

  if (correctCount < total) {
    topicsReview.style.display = 'block';
    const topics = [];
    if (lvl === 0) topics.push('Irregular & regular verbs (past tense)');
    if (lvl === 1) topics.push('Urutan kejadian dalam recount text');
    if (lvl === 2) topics.push('Struktur recount text (Orientation, Events, Re-orientation)');
    if (lvl === 3) topics.push('Time connectors & past tense dalam konteks');
    if (gameState.lives <= 3) topics.push('Konsistensi dan ketelitian dalam menjawab');

    topics.forEach(t => {
      topicsList.innerHTML += `<li>${t}</li>`;
    });
  } else {
    topicsReview.style.display = 'none';
  }
}

function replayLevel() {
  startLevel(gameState.currentLevel);
}

// ============================================================
// INIT
// ============================================================
renderMenu();
</script>
