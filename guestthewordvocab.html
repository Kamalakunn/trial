<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUESS MY WORD: THE VOCABULARY CHALLENGE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
    position: relative;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255,215,0,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  
  .screen { 
    display: none; 
    padding: 20px; 
    min-height: 100vh; 
    position: relative;
    z-index: 1;
  }
  .screen.active { display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.6s ease; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* SETUP SCREEN */
  .game-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    text-align: center;
    margin: 20px 0;
    background: linear-gradient(45deg, #ffd700, #ff6b6b, #4ecdc4, #ffd700);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    letter-spacing: 2px;
  }
  
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  
  .subtitle {
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: #fff;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  
  .setup-box {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 25px;
    padding: 30px;
    max-width: 700px;
    width: 95%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  
  .setup-box h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #ffd700;
    font-size: 1.5rem;
  }
  
  .mode-selector {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
  }
  
  .mode-btn {
    padding: 20px 15px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  
  .mode-btn:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.2);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  
  .mode-btn.selected {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    border-color: #fff;
    transform: scale(1.05);
  }
  
  .mode-icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
  .mode-name { display: block; font-size: 1rem; margin-bottom: 3px; }
  .mode-desc { display: block; font-size: 0.75rem; opacity: 0.9; }
  
  .team-inputs { margin-bottom: 20px; }
  .team-inputs.hidden { display: none; }
  
  .team-input {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.1);
    padding: 12px 15px;
    border-radius: 12px;
  }
  
  .team-color {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid white;
    flex-shrink: 0;
    box-shadow: 0 0 15px currentColor;
  }
  
  .team-input input {
    flex: 1;
    padding: 10px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.3);
    color: white;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  
  .team-input input:focus { outline: none; border-color: #ffd700; }
  
  .btn {
    background: linear-gradient(45deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    border: none;
    padding: 15px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    box-shadow: 0 8px 20px rgba(255, 140, 0, 0.4);
    margin-top: 15px;
    font-family: inherit;
  }
  
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(255, 140, 0, 0.6);
  }
  
  .btn:active { transform: translateY(0); }
  
  .btn-secondary {
    background: linear-gradient(45deg, #4ecdc4, #44a08d);
    color: white;
    box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
  }
  
  .btn-danger {
    background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
  }
  
  /* GAME SCREEN */
  .game-header {
    width: 100%;
    max-width: 1200px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    padding: 15px 25px;
    border-radius: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
    border: 2px solid rgba(255,255,255,0.2);
  }
  
  .round-info {
    font-size: 1.2rem;
    font-weight: bold;
    color: #ffd700;
  }
  
  .timer-display {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.5rem;
    font-weight: bold;
  }
  
  .timer-value {
    background: rgba(255,255,255,0.2);
    padding: 8px 20px;
    border-radius: 30px;
    min-width: 80px;
    text-align: center;
    border: 2px solid #ffd700;
  }
  
  .timer-value.warning {
    background: rgba(255, 107, 107, 0.3);
    border-color: #ff6b6b;
    animation: pulse 0.5s infinite;
    color: #ffeb3b;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .scoreboard {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }
  
  .score-card {
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    border: 3px solid white;
    transition: all 0.3s;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
  }
  
  .score-card.active {
    transform: scale(1.08);
    box-shadow: 0 0 30px currentColor;
    animation: activeTeam 1s infinite alternate;
  }
  
  @keyframes activeTeam {
    from { box-shadow: 0 0 20px currentColor; }
    to { box-shadow: 0 0 40px currentColor; }
  }
  
  .score-card .team-name {
    font-size: 1rem;
    margin-bottom: 5px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  }
  
  .score-card .score-value {
    font-size: 2rem;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    color: #ffd700;
  }
  
  /* GAME AREA */
  .game-area {
    width: 100%;
    max-width: 1000px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  
  .category-badge {
    display: inline-block;
    padding: 8px 20px;
    background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 1rem;
    letter-spacing: 1px;
    box-shadow: 0 5px 15px rgba(238, 90, 111, 0.4);
  }
  
  .category-badge .cat-icon { margin-right: 8px; }
  
  .clue-container {
    margin: 20px 0;
  }
  
  .clue-card {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: all 0.5s;
    opacity: 0.3;
    transform: translateX(-20px);
  }
  
  .clue-card.revealed {
    opacity: 1;
    transform: translateX(0);
    animation: clueReveal 0.6s ease;
  }
  
  .clue-card.locked {
    background: rgba(0,0,0,0.2);
  }
  
  @keyframes clueReveal {
    0% { transform: translateX(-30px) scale(0.9); opacity: 0; }
    50% { transform: translateX(10px) scale(1.05); }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  
  .clue-number {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.3rem;
    flex-shrink: 0;
    box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
  }
  
  .clue-card.locked .clue-number {
    background: rgba(255,255,255,0.2);
    color: white;
  }
  
  .clue-text {
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    line-height: 1.5;
    flex: 1;
  }
  
  .clue-card.locked .clue-text {
    color: rgba(255,255,255,0.5);
    font-style: italic;
  }
  
  .points-badge {
    background: rgba(76, 175, 80, 0.3);
    border: 2px solid #4caf50;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  
  /* ANSWER AREA */
  .answer-area {
    margin-top: 25px;
    padding: 20px;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
  }
  
  .answer-label {
    font-size: 1.1rem;
    margin-bottom: 12px;
    color: #ffd700;
    font-weight: bold;
  }
  
  .answer-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  
  .answer-input {
    flex: 1;
    min-width: 200px;
    padding: 12px 18px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
    font-size: 1.1rem;
    font-family: inherit;
  }
  
  .answer-input:focus { outline: none; border-color: #ffd700; }
  
  .submit-btn {
    padding: 12px 25px;
    background: linear-gradient(45deg, #4caf50, #45a049);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s;
  }
  
  .submit-btn:hover { transform: scale(1.05); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  
  .option-btn {
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    transition: all 0.3s;
    font-family: inherit;
  }
  
  .option-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.25);
    transform: translateY(-3px);
  }
  
  .option-btn.correct {
    background: linear-gradient(45deg, #4caf50, #45a049);
    border-color: #fff;
    animation: correctPulse 0.6s;
  }
  
  .option-btn.wrong {
    background: linear-gradient(45deg, #f44336, #d32f2f);
    border-color: #fff;
  }
  
  @keyframes correctPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  
  .option-btn:disabled { cursor: not-allowed; }
  
  /* RESULT REVEAL */
  .word-reveal {
    margin-top: 20px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(69, 160, 73, 0.2));
    border: 3px solid #4caf50;
    border-radius: 15px;
    text-align: center;
    animation: revealBounce 0.8s ease;
    display: none;
  }
  
  .word-reveal.show { display: block; }
  
  .word-reveal.wrong-answer {
    background: linear-gradient(135deg, rgba(244, 67, 54, 0.2), rgba(211, 47, 47, 0.2));
    border-color: #f44336;
  }
  
  @keyframes revealBounce {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  
  .reveal-word {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  
  .reveal-meaning {
    font-size: 1.2rem;
    color: #fff;
    margin-bottom: 10px;
  }
  
  .reveal-example {
    font-size: 1rem;
    color: #bbdefb;
    font-style: italic;
    padding: 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    margin-top: 10px;
  }
  
  .reveal-example strong { color: #ffd700; font-style: normal; }
  
  .next-btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: linear-gradient(45deg, #2196f3, #1976d2);
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  
  .next-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(33, 150, 243, 0.5); }
  
  /* RESULTS SCREEN */
  #resultsScreen {
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
  }
  
  .trophy {
    font-size: clamp(5rem, 15vw, 8rem);
    animation: trophyBounce 1s infinite alternate;
    filter: drop-shadow(0 0 30px gold);
  }
  
  @keyframes trophyBounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-20px) rotate(5deg); }
  }
  
  .champion-title {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: #ffd700;
    margin: 15px 0;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    letter-spacing: 2px;
  }
  
  .champion-name {
    font-size: clamp(1.8rem, 5vw, 3rem);
    padding: 20px 40px;
    border: 5px solid #ffd700;
    border-radius: 20px;
    background: rgba(0,0,0,0.5);
    animation: championPulse 2s infinite;
    margin-bottom: 25px;
  }
  
  @keyframes championPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
    50% { box-shadow: 0 0 60px rgba(255, 215, 0, 1); }
  }
  
  .ranking {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 600px;
    width: 100%;
    margin: 20px 0;
  }
  
  .rank-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 25px;
    border-radius: 15px;
    border: 3px solid white;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    transition: transform 0.3s;
  }
  
  .rank-item:hover { transform: translateX(10px); }
  
  .rank-badge { font-size: 2rem; min-width: 50px; }
  .rank-name { flex: 1; text-align: left; font-weight: bold; font-size: 1.2rem; }
  .rank-score { font-size: 1.5rem; color: #ffd700; font-weight: bold; }
  .rank-title { font-size: 0.85rem; color: #bbdefb; display: block; }
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
    max-width: 600px;
    width: 100%;
    margin: 20px 0;
  }
  
  .stat-box {
    background: rgba(255,255,255,0.15);
    padding: 15px;
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .stat-value { font-size: 1.8rem; color: #ffd700; font-weight: bold; }
  .stat-label { font-size: 0.85rem; color: #fff; margin-top: 5px; }
  
  /* POINT POPUP */
  .point-popup {
    position: fixed;
    font-size: 3rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 2000;
    animation: pointFloat 1.5s ease-out forwards;
    text-shadow: 0 0 20px currentColor;
  }
  
  @keyframes pointFloat {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { transform: translateY(-20px) scale(1.3); opacity: 1; }
    100% { transform: translateY(-150px) scale(1); opacity: 0; }
  }
  
  .point-popup.positive { color: #4caf50; }
  .point-popup.negative { color: #f44336; }
  
  /* CONFETTI */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall 3s linear forwards;
  }
  
  @keyframes confettiFall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }
  
  /* FLOATING EMOJIS */
  .floating-emoji {
    position: fixed;
    font-size: 3rem;
    pointer-events: none;
    z-index: 1500;
    animation: emojiFloat 2s ease-out forwards;
  }
  
  @keyframes emojiFloat {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    30% { transform: translateY(-50px) scale(1.5); opacity: 1; }
    100% { transform: translateY(-200px) scale(1); opacity: 0; }
  }
  
  /* LEADERBOARD */
  .leaderboard-section {
    width: 100%;
    max-width: 600px;
    margin-top: 20px;
  }
  
  .leaderboard-title {
    color: #ffd700;
    font-size: 1.3rem;
    margin-bottom: 15px;
    text-align: center;
  }
  
  .leaderboard-list {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 15px;
    border: 2px solid rgba(255,255,255,0.2);
  }
  
  .lb-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { color: #ffd700; font-weight: bold; min-width: 30px; }
  .lb-name { flex: 1; }
  .lb-score { color: #4ecdc4; font-weight: bold; }
  
  .no-lb { text-align: center; padding: 20px; opacity: 0.7; }
  
  /* RESPONSIVE */
  @media (max-width: 600px) {
    .game-area { padding: 20px 15px; }
    .clue-card { padding: 12px; gap: 10px; }
    .clue-number { width: 35px; height: 35px; font-size: 1rem; }
    .options-grid { grid-template-columns: 1fr; }
    .game-header { padding: 12px 15px; }
  }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="screen active">
  <h1 class="game-title">🎯 GUESS MY WORD 🎯</h1>
  <p class="subtitle">THE VOCABULARY CHALLENGE</p>
  
  <div class="setup-box">
    <h2>🎮 PILIH MODE PERMAINAN</h2>
    <div class="mode-selector">
      <button class="mode-btn" data-mode="solo" onclick="selectMode('solo')">
        <span class="mode-icon">👤</span>
        <span class="mode-name">SOLO MODE</span>
        <span class="mode-desc">Main sendiri</span>
      </button>
      <button class="mode-btn" data-mode="team" onclick="selectMode('team')">
        <span class="mode-icon">👥</span>
        <span class="mode-name">TEAM BATTLE</span>
        <span class="mode-desc">2 Tim bersaing</span>
      </button>
      <button class="mode-btn" data-mode="speed" onclick="selectMode('speed')">
        <span class="mode-icon">⚡</span>
        <span class="mode-name">SPEED MODE</span>
        <span class="mode-desc">Secepat mungkin!</span>
      </button>
    </div>
    
    <div id="teamInputs" class="team-inputs hidden">
      <h3 style="text-align:center; margin-bottom:15px; color:#ffd700;">👥 NAMA TIM</h3>
      <div class="team-input">
        <div class="team-color" style="background: #e53935; color: #e53935;"></div>
        <input type="text" id="team1Name" placeholder="Nama Tim 1" value="TEAM RED" maxlength="20">
      </div>
      <div class="team-input">
        <div class="team-color" style="background: #1e88e5; color: #1e88e5;"></div>
        <input type="text" id="team2Name" placeholder="Nama Tim 2" value="TEAM BLUE" maxlength="20">
      </div>

        "I often has pools, restaurants, and entertainment.",
        "People go to me for holidays."
      ]},
      { word: "Heritage", meaning: "Warisan", example: "Borobudur is part of Indonesia's cultural <strong>heritage</strong>.", clues: [
        "I am something passed down from previous generations.",
        "I include traditions, buildings, and culture.",
        "UNESCO protects world sites of me."
      ]}
    ]
  }
};

// ============ VARIABEL GAME ============
let gameMode = null;
let teams = [];
let currentTeamIndex = 0;
let currentRound = 0;
let totalRounds = 20;
let usedWords = new Set();
let currentWord = null;
let currentCategory = null;
let currentClueIndex = 0;
let roundTimer = null;
let timeLeft = 20;
let roundActive = false;
let roundAnswered = false;
let audioCtx = null;
let gameWords = []; // Daftar kata yang sudah diacak untuk game

// ============ SETUP ============
function selectMode(mode) {
  gameMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
  
  document.getElementById('teamInputs').classList.toggle('hidden', mode !== 'team');
  document.getElementById('soloInput').classList.toggle('hidden', mode !== 'solo');
}

function startGame() {
  if (!gameMode) {
    alert('Pilih mode permainan terlebih dahulu!');
    return;
  }
  
  teams = [];
  if (gameMode === 'solo') {
    const name = document.getElementById('playerName').value.trim() || 'PLAYER';
    teams.push({ name: name.toUpperCase(), color: '#ffd700', score: 0, correct: 0, fastest: 0 });
  } else if (gameMode === 'team') {
    const n1 = document.getElementById('team1Name').value.trim() || 'TEAM RED';
    const n2 = document.getElementById('team2Name').value.trim() || 'TEAM BLUE';
    teams.push({ name: n1.toUpperCase(), color: '#e53935', score: 0, correct: 0, fastest: 0 });
    teams.push({ name: n2.toUpperCase(), color: '#1e88e5', score: 0, correct: 0, fastest: 0 });
  } else if (gameMode === 'speed') {
    const name = document.getElementById('playerName')?.value.trim() || 'PLAYER';
    teams.push({ name: name.toUpperCase(), color: '#4ecdc4', score: 0, correct: 0, fastest: 0 });
  }
  
  currentTeamIndex = 0;
  currentRound = 0;
  usedWords.clear();
  gameWords = generateWordList();
  
  document.getElementById('setupScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  
  renderScoreboard();
  startNewRound();
}

function generateWordList() {
  // Buat daftar kata yang diacak dari semua kategori
  const allWords = [];
  for (const catName in wordDatabase) {
    const cat = wordDatabase[catName];
    cat.words.forEach(w => {
      allWords.push({ ...w, category: catName, icon: cat.icon });
    });
  }
  // Shuffle
  for (let i = allWords.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allWords[i], allWords[j]] = [allWords[j], allWords[i]];
  }
  return allWords.slice(0, totalRounds);
}

function renderScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  teams.forEach((team, i) => {
    const card = document.createElement('div');
    card.className = 'score-card' + (i === currentTeamIndex ? ' active' : '');
    card.style.borderColor = team.color;
    card.style.color = team.color;
    card.innerHTML = `
      <div class="team-name" style="color: ${team.color};">${team.name}</div>
      <div class="score-value">${team.score}</div>
    `;
    sb.appendChild(card);
  });
}

// ============ ROUND LOGIC ============
function startNewRound() {
  if (currentRound >= totalRounds) {
    endGame();
    return;
  }
  
  currentRound++;
  currentClueIndex = 0;
  roundAnswered = false;
  roundActive = true;
  
  // Ambil kata berikutnya
  currentWord = gameWords[currentRound - 1];
  currentCategory = currentWord.category;
  
  document.getElementById('roundNumber').textContent = currentRound;
  document.getElementById('categoryBadge').querySelector('.cat-icon').textContent = currentWord.icon;
  document.getElementById('categoryName').textContent = currentCategory.toUpperCase();
  
  // Render clues
  renderClues();
  
  // Render options (4 pilihan)
  renderOptions();
  
  // Reset input
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('wordReveal').classList.remove('show');
  document.getElementById('answerArea').style.display = 'block';
  
  // Start timer
  startTimer();
  
  // Update team indicator
  renderScoreboard();
}

function renderClues() {
  const container = document.getElementById('clueContainer');
  container.innerHTML = '';
  
  const pointsPerClue = [30, 20, 10];
  
  currentWord.clues.forEach((clue, i) => {
    const card = document.createElement('div');
    card.className = 'clue-card' + (i <= currentClueIndex ? ' revealed' : ' locked');
    card.id = `clue-${i}`;
    card.innerHTML = `
      <div class="clue-number">${i + 1}</div>
      <div class="clue-text">${i <= currentClueIndex ? clue : '🔒 Clue terkunci - salah menjawab untuk membuka'}</div>
      <div class="points-badge">${pointsPerClue[i]} pts</div>
    `;
    container.appendChild(card);
  });
}

function renderOptions() {
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  
  // Dapatkan 3 kata lain dari kategori yang sama atau berbeda sebagai distraktor
  const distractors = [];
  const allWords = [];
  for (const catName in wordDatabase) {
    wordDatabase[catName].words.forEach(w => {
      if (w.word !== currentWord.word) allWords.push(w.word);
    });
  }
  
  // Shuffle dan ambil 3
  const shuffled = allWords.sort(() => Math.random() - 0.5);
  distractors.push(...shuffled.slice(0, 3));
  
  // Gabungkan dengan jawaban benar dan shuffle
  const options = [currentWord.word, ...distractors].sort(() => Math.random() - 0.5);
  
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectOption(btn, opt);
    grid.appendChild(btn);
  });
}

function selectOption(btn, selected) {
  if (roundAnswered || !roundActive) return;
  
  // Disable semua tombol
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  
  if (selected === currentWord.word) {
    btn.classList.add('correct');
    handleCorrectAnswer();
  } else {
    btn.classList.add('wrong');
    handleWrongAnswer();
  }
}

function submitAnswer() {
  if (roundAnswered || !roundActive) return;
  
  const input = document.getElementById('answerInput');
  const answer = input.value.trim();
  
  if (!answer) {
    input.focus();
    return;
  }
  
  // Cek jawaban (case insensitive)
  if (answer.toLowerCase() === currentWord.word.toLowerCase()) {
    handleCorrectAnswer();
  } else {
    handleWrongAnswer();
    input.value = '';
    input.focus();
  }
}

function handleCorrectAnswer() {
  roundAnswered = true;
  roundActive = false;
  clearInterval(roundTimer);
  
  const pointsPerClue = [30, 20, 10];
  const points = pointsPerClue[currentClueIndex];
  
  teams[currentTeamIndex].score += points;
  teams[currentTeamIndex].correct++;
  
  // Speed mode: bonus waktu
  if (gameMode === 'speed') {
    const timeBonus = Math.floor(timeLeft / 2);
    teams[currentTeamIndex].score += timeBonus;
    teams[currentTeamIndex].fastest++;
  }
  
  showPointPopup(currentTeamIndex, '+' + points, true);
  playSound('correct');
  launchEmojis(['🎉', '⭐', '✨', '🎊'], 5);
  
  // Disable input
  document.getElementById('answerInput').disabled = true;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  
  // Show word reveal
  showWordReveal(true, points);
  renderScoreboard();
}

function handleWrongAnswer() {
  playSound('wrong');
  
  if (currentClueIndex < 2) {
    currentClueIndex++;
    renderClues();
    showPointPopup(currentTeamIndex, 'Next Clue!', false);
  } else {
    // Semua clue sudah dibuka, ronde berakhir tanpa poin
    roundAnswered = true;
    roundActive = false;
    clearInterval(roundTimer);
    document.getElementById('answerInput').disabled = true;
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    showWordReveal(false, 0);
  }
}

function showWordReveal(correct, points) {
  const reveal = document.getElementById('wordReveal');
  reveal.classList.add('show');
  if (!correct) reveal.classList.add('wrong-answer');
  else reveal.classList.remove('wrong-answer');
  
  document.getElementById('revealWord').innerHTML = (correct ? '✅ ' : '❌ ') + currentWord.word;
  document.getElementById('revealMeaning').innerHTML = `📖 <strong>Arti:</strong> ${currentWord.meaning}` + (correct ? ` (+${points} poin!)` : ' (0 poin)');
  document.getElementById('revealExample').innerHTML = `💬 <strong>Contoh:</strong> ${currentWord.example}`;
  
  document.getElementById('answerArea').style.display = 'none';
}

function nextRound() {
  // Team battle: giliran bergantian
  if (gameMode === 'team') {
    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
  }
  startNewRound();
}

// ============ TIMER ============
function startTimer() {
  clearInterval(roundTimer);
  const baseTime = gameMode === 'speed' ? 15 : 20;
  timeLeft = baseTime;
  updateTimerDisplay();
  
  roundTimer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(roundTimer);
      handleTimeUp();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timerValue');
  el.textContent = timeLeft;
  if (timeLeft <= 5) el.classList.add('warning');
  else el.classList.remove('warning');
}

function handleTimeUp() {
  if (roundAnswered) return;
  roundAnswered = true;
  roundActive = false;
  
  playSound('timeout');
  document.getElementById('answerInput').disabled = true;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  
  // Buka semua clue
  currentClueIndex = 2;
  renderClues();
  
  showWordReveal(false, 0);
}

// ============ END GAME ============
function endGame() {
  clearInterval(roundTimer);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  
  // Sort teams by score
  const sorted = [...teams].sort((a, b) => b.score - a.score);
  
  // Champion
  const champion = sorted[0];
  document.getElementById('championName').textContent = champion.name;
  document.getElementById('championName').style.color = champion.color;
  document.getElementById('championName').style.borderColor = champion.color;
  
  // Title berdasarkan skor
  let title = 'VOCABULARY MASTER';
  if (champion.score >= 500) title = '👑 VOCABULARY LEGEND 👑';
  else if (champion.score >= 300) title = '🌟 VOCABULARY MASTER 🌟';
  else if (champion.score >= 150) title = '✨ WORD WIZARD ✨';
  else title = '📚 VOCABULARY LEARNER 📚';
  
  document.getElementById('championTitle').textContent = title;
  
  // Stats
  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = `
    <div class="stat-box">
      <div class="stat-value">${totalRounds}</div>
      <div class="stat-label">Total Ronde</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${champion.correct}</div>
      <div class="stat-label">Jawaban Benar</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${champion.score}</div>
      <div class="stat-label">Total Skor</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${Math.round(champion.correct/totalRounds*100)}%</div>
      <div class="stat-label">Akurasi</div>
    </div>
  `;
  
  // Ranking
  const ranking = document.getElementById('ranking');
  ranking.innerHTML = '';
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  const titles = ['Vocabulary Master', 'Word Expert', 'Rising Star', 'Keep Learning!'];
  
  sorted.forEach((team, i) => {
    const item = document.createElement('div');
    item.className = 'rank-item';
    item.style.borderColor = team.color;
    item.innerHTML = `
      <div class="rank-badge">${medals[i]}</div>
      <div class="rank-name" style="color: ${team.color};">
        ${team.name}
        <span class="rank-title">${titles[i] || 'Participant'}</span>
      </div>
      <div class="rank-score">${team.score}</div>
    `;
    ranking.appendChild(item);
  });
  
  playSound('victory');
  launchConfetti();
  
  // Save to leaderboard
  saveToLeaderboard(champion.name, champion.score);
}

// ============ LEADERBOARD ============
function saveToLeaderboard(name, score) {
  try {
    let lb = JSON.parse(localStorage.getItem('gmw_leaderboard') || '[]');
    lb.push({ name, score, date: new Date().toLocaleDateString('id-ID'), mode: gameMode });
    lb.sort((a, b) => b.score - a.score);
    lb = lb.slice(0, 10);
    localStorage.setItem('gmw_leaderboard', JSON.stringify(lb));
  } catch (e) {}
}

function loadLeaderboard() {
  try {
    const lb = JSON.parse(localStorage.getItem('gmw_leaderboard') || '[]');
    const list = document.getElementById('leaderboardList');
    if (lb.length === 0) {
      list.innerHTML = '<div class="no-lb">Belum ada skor. Jadilah yang pertama!</div>';
      return;
    }
    list.innerHTML = '';
    lb.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'lb-item';
      div.innerHTML = `
        <span class="lb-rank">${i+1}.</span>
        <span class="lb-name">${item.name} <small style="opacity:0.6">(${item.mode})</small></span>
        <span class="lb-score">${item.score}</span>
      `;
      list.appendChild(div);
    });
  } catch (e) {}
}

// ============ UTILITIES ============
function showPointPopup(teamIdx, text, positive) {
  const popup = document.createElement('div');
  popup.className = 'point-popup ' + (positive ? 'positive' : 'negative');
  popup.textContent = text;
  const scoreCards = document.querySelectorAll('.score-card');
  if (scoreCards[teamIdx]) {
    const rect = scoreCards[teamIdx].getBoundingClientRect();
    popup.style.left = (rect.left + rect.width / 2 - 50) + 'px';
    popup.style.top = rect.top + 'px';
  } else {
    popup.style.left = '50%';
    popup.style.top = '50%';
  }
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1500);
}

function launchEmojis(emojis, count) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const emoji = document.createElement('div');
      emoji.className = 'floating-emoji';
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = (Math.random() * 80 + 10) + 'vw';
      emoji.style.top = (Math.random() * 40 + 40) + 'vh';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 2000);
    }, i * 100);
  }
}

function launchConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#f093fb', '#45b7d1', '#96ceb4'];
  for (let i = 0; i < 100; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = '-20px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4000);
    }, i * 40);
  }
}

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    
    if (type === 'correct') {
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.3, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
      });
    } else if (type === 'wrong') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(300, now);
      o.frequency.exponentialRampToValueAtTime(100, now + 0.3);
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      o.start(now); o.stop(now + 0.3);
    } else if (type === 'timeout') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(200, now);
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      o.start(now); o.stop(now + 0.5);
    } else if (type === 'victory') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.15);
        g.gain.setValueAtTime(0.3, now + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.4);
      });
    }
  } catch (e) {}
}

function confirmRestart() {
  if (confirm('Yakin ingin mengulang permainan?')) {
    restartGame();
  }
}

function restartGame() {
  clearInterval(roundTimer);
  currentRound = 0;
  usedWords.clear();
  teams.forEach(t => { t.score = 0; t.correct = 0; t.fastest = 0; });
  gameWords = generateWordList();
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  renderScoreboard();
  startNewRound();
}

function goToSetup() {
  clearInterval(roundTimer);
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('setupScreen').classList.add('active');
  loadLeaderboard();
}

// ============ EVENT LISTENERS ============
document.getElementById('answerInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitAnswer();
});

// ============ INIT ============
window.onload = () => {
  loadLeaderboard();
  document.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }, { once: true });
};
